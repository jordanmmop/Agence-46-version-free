# Chaine complete : code source -> exe Windows -> MSIX -> validation ->
# artefact -> GitHub Release, sur un runner Windows.
#
# DECLENCHEMENT
#   - tag « v1.2.3 »   : produit le paquet ET la GitHub Release
#   - manuellement     : produit le paquet seul (aucune release)
#
# CE QUE LE PIPELINE NE FAIT PAS, ET POURQUOI
#   - il ne soumet rien au Microsoft Store. La soumission exige des
#     identifiants Partner Center et une identite reservee (voir
#     WINDOWS-MSIX.md, sections M et N). Tout ce qui peut l'etre est prepare
#     automatiquement ; l'etape de soumission reste manuelle, et le document
#     dit exactement laquelle.
#   - il n'embarque pas les moteurs IA (Ollama, Hermes, MetaTrader 5) : le
#     dossier d'installation d'un MSIX est en lecture seule, et 5 a 10 Go
#     depassent ce qu'une release GitHub transporte. L'application telecharge
#     ses moteurs au premier lancement, dans ~/.agence_financiere.
#
# SECRETS ATTENDUS (aucun n'est obligatoire)
#   MSIX_CERTIFICATE_BASE64    un .pfx encode en base64
#   MSIX_CERTIFICATE_PASSWORD  son mot de passe
#   Absents, le pipeline fabrique un certificat de TEST a la volee et signe
#   avec. Le paquet reste parfaitement valide pour le Store, qui re-signe
#   lui-meme les paquets publies.

name: Build Windows MSIX

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      configuration:
        description: "Release (Store) ou Debug (diagnostic)"
        required: false
        default: "Release"
        type: choice
        options: [Release, Debug]

# Le paquet et la release sont ecrits par ce workflow : rien d'autre.
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60

    env:
      # Identite du paquet. Laissees vides, les valeurs de
      # packaging/msix/msix.config.json s'appliquent (identite de TEST).
      # Renseignez ces variables - ou les secrets du meme nom - avec les
      # valeurs fournies par Partner Center pour produire un paquet publiable.
      MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
      MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
      MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          # Cache des roues pip : gain de plusieurs minutes sans rien changer
          # au resultat (les versions restent celles des requirements).
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r python/requirements.txt -r backend/requirements.txt
          # pywebview : indispensable a la FENETRE native (app_window.py).
          # Sans lui, l'exe est construit sans interface : double-clic =
          # processus fantome invisible.
          pip install pyinstaller pywebview

      # La suite de tests tourne AVANT la compilation : inutile de passer
      # quinze minutes a empaqueter un code dont les tests echouent.
      - name: Run test suite
        run: python python/tests/run_tests.py

      # Controle de configuration sans rien produire : identite, version,
      # manifeste, icones, outils du SDK. Quelques secondes, et cela evite de
      # decouvrir un manifeste invalide apres la compilation.
      - name: Verify packaging configuration (dry-run)
        shell: pwsh
        run: |
          ./packaging/msix/scripts/build-msix.ps1 -DryRun
          if ($LASTEXITCODE -ne 0) { throw "configuration d'empaquetage invalide" }

      - name: Build Windows application and MSIX package
        shell: pwsh
        run: |
          $configuration = "${{ inputs.configuration }}"
          if (-not $configuration) { $configuration = "Release" }
          ./packaging/msix/scripts/build-msix.ps1 -Configuration $configuration
          if ($LASTEXITCODE -ne 0) { throw "la construction du paquet MSIX a echoue" }

      # Certificat : celui des secrets s'il existe, sinon un certificat de
      # TEST fabrique ici. Dans les deux cas le paquet finit signe, donc
      # installable - c'est ce qui permet au smoke test ci-dessous d'exister.
      - name: Prepare signing certificate
        id: certificat
        shell: pwsh
        env:
          MSIX_CERTIFICATE_BASE64: ${{ secrets.MSIX_CERTIFICATE_BASE64 }}
        run: |
          if ($env:MSIX_CERTIFICATE_BASE64) {
            Write-Host "Certificat fourni par les secrets du depot."
            "type=secret" >> $env:GITHUB_OUTPUT
          }
          else {
            Write-Host "Aucun secret : creation d'un certificat de TEST."
            # Le runner est administrateur : le certificat est aussi installe
            # dans le magasin de confiance, ce qui rend l'installation d'essai
            # possible quelques etapes plus bas.
            ./packaging/msix/scripts/create-test-certificate.ps1
            if ($LASTEXITCODE -ne 0) { throw "creation du certificat de test impossible" }
            "type=test" >> $env:GITHUB_OUTPUT
          }

      - name: Sign MSIX package
        shell: pwsh
        env:
          MSIX_CERTIFICATE_BASE64: ${{ secrets.MSIX_CERTIFICATE_BASE64 }}
          MSIX_CERTIFICATE_PASSWORD: ${{ secrets.MSIX_CERTIFICATE_PASSWORD }}
        run: |
          ./packaging/msix/scripts/sign-msix.ps1
          if ($LASTEXITCODE -ne 0) { throw "la signature du paquet a echoue" }

      # Validation statique : contenu reel du paquet, manifeste, DLL Python,
      # icones, signature. Un echec ici arrete le pipeline AVANT toute
      # publication.
      - name: Validate MSIX package
        shell: pwsh
        run: |
          ./packaging/msix/scripts/validate-msix.ps1
          if ($LASTEXITCODE -ne 0) { throw "la validation du paquet a echoue" }

      # Le seul controle qui prouve quelque chose : installer le paquet, le
      # lancer par le menu Demarrer, verifier que le serveur repond et que la
      # version servie est la bonne, puis desinstaller.
      #
      # Un import manquant ou une donnee non embarquee produit un paquet
      # parfaitement valide qui meurt au lancement - et personne ne s'en
      # apercoit avant l'utilisateur.
      - name: Install, launch and uninstall the package
        shell: pwsh
        run: |
          ./packaging/msix/scripts/install-test.ps1 -Desinstaller -DelaiDemarrage 240
          if ($LASTEXITCODE -ne 0) { throw "le test d'installation a echoue" }

      - name: Upload MSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: AgenceNumerique-MSIX
          path: |
            dist/msix/*.msix
            dist/msix/SHA256SUMS.txt
          retention-days: 30
          if-no-files-found: error

      # La partie PUBLIQUE du certificat de test accompagne le paquet : sans
      # elle, personne ne peut installer un paquet signe par un certificat
      # auto-signe. Ce n'est PAS la cle privee, qui ne quitte jamais le runner.
      - name: Upload test certificate (public part only)
        if: steps.certificat.outputs.type == 'test'
        uses: actions/upload-artifact@v4
        with:
          name: AgenceNumerique-MSIX-certificat-public
          path: dist/msix/certificat/*.cer
          retention-days: 30
          if-no-files-found: warn

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/msix/*.msix
            dist/msix/SHA256SUMS.txt
          body: |
            ## Paquet Windows MSIX

            Verifiez l'integrite du telechargement avec `SHA256SUMS.txt` :

            ```powershell
            Get-FileHash .\AgenceNumerique-*.msix -Algorithm SHA256
            ```

            ### Installation

            Ce paquet est signe par un certificat de **test**. Windows ne
            l'installera qu'apres avoir approuve ce certificat (fichier `.cer`
            joint aux artefacts du build) :

            ```powershell
            # PowerShell administrateur
            Import-Certificate -FilePath .\AgenceNumerique-Test.cer `
                               -CertStoreLocation Cert:\LocalMachine\TrustedPeople
            Add-AppxPackage -Path .\AgenceNumerique-<version>-x64.msix
            ```

            Le paquet destine au Microsoft Store n'a pas besoin de cette etape :
            le Store re-signe lui-meme les paquets publies.

            Procedure complete : [WINDOWS-MSIX.md](WINDOWS-MSIX.md).
