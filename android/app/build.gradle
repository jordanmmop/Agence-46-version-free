plugins {
    id 'com.android.application'
}

android {
    namespace 'com.agence.financiere'
    compileSdk 34

    defaultConfig {
        applicationId "com.agence.financiere"
        minSdk 24
        targetSdk 34
        versionCode 4
        versionName "4.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
