services:
  - type: web
    name: agence-numerique-financiere
    env: python
    region: frankfurt
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r python/requirements.txt -r backend/requirements.txt
    startCommand: python server.py
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # ANTHROPIC_API_KEY retirée : le mode IA distant n'existe plus (les deux
      # moteurs sont locaux, cf. python/config.py), et app_config EFFACE cette
      # clé du disque au démarrage. La laisser déclarée ici n'activait rien —
      # elle invitait seulement à coller une vraie clé dans l'environnement
      # d'un service web public, pour une fonctionnalité absente.
      #
      # Clé PUBLIQUE de l'émetteur de licences : aucune valeur secrète, elle
      # ne permet QUE de vérifier une signature (cf. licence/verification.py).
      - key: AGENCE_LICENCE_PUBKEY
        sync: false
      # Émetteur de licences (HTTPS obligatoire). Ni clé ni jeton : seule
      # l'URL du service.
      - key: LICENCE_API_URL
        sync: false
      # Paiement Stripe. SECRETS : « sync: false » signifie qu'aucune valeur
      # n'est committée ici — elles se saisissent dans le tableau de bord de
      # l'hébergeur. Sans elles, aucun paiement ne peut être confirmé.
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: CAPITAL_INITIAL
        value: "100000"
      - key: BACKEND_HOST
        value: "0.0.0.0"
      - key: PYTHONPATH
        value: "python:."
